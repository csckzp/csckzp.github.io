<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-Side QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            background: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        small {
            display: block;
            margin-top: 10px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>QR Code Generator</h2>
    <input type="text" id="text-input" placeholder="Type a URL or text..." value="https://example.com">

    <div class="logo-row">
        <label for="logo-input">Center logo (optional):</label>
        <input type="file" id="logo-input" accept="image/*">
        <button id="clear-logo" type="button">Clear</button>
    </div>

    <p>Code</p>
    <div id="qrcode" style="position: relative;">
        <img id="gif-overlay" alt="animated logo"
             style="display:none; position:absolute; top:50%; left:50%;
                    transform:translate(-50%,-50%);
                    width:22%; background:#ffffff; padding:4px; box-sizing:border-box;">
    </div>
    <small>Uses High error correction, so a small centered logo — static or animated — won't break scanning.</small>
</div>
<script>
    const qrContainer = document.getElementById("qrcode");
    const textInput = document.getElementById("text-input");
    const logoInput = document.getElementById("logo-input");
    const clearLogoBtn = document.getElementById("clear-logo");

    const gifOverlay = document.getElementById("gif-overlay");

    let logoImage = null; // holds an HTMLImageElement for a STATIC logo (baked into canvas)
    let isGifLogo = false; // true when using the live <img> overlay instead

    // Force canvas render mode explicitly (qrcode.js defaults to this,
    // but being explicit avoids ever falling back to the <table> renderer)
    const qrcode = new QRCode(qrContainer, {
        text: textInput.value,
        width: 1024,
        height: 1024,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H,
        useSVG: false
    });

    function getCanvas() {
        return qrContainer.querySelector("canvas");
    }

    function drawLogo() {
        const canvas = getCanvas();
        if (!canvas) return;

        // qrcode.js immediately converts the canvas to a static <img> and
        // hides the canvas (a legacy Android-compat workaround that runs
        // on every browser). Drawing onto the canvas alone changes nothing
        // visible, so we always need to push the result back into the img.
        // Note: this is only the LIBRARY's own <img> (its rendered QR code),
        // not our gif-overlay element, which is a separate sibling untouched
        // by any of this.
        const img = qrContainer.querySelector("#qrcode > img:not(#gif-overlay)");

        // GIF logos live entirely in the CSS overlay — nothing to bake in,
        // and baking a single frame into the canvas would just be redundant
        // work sitting underneath the animated overlay anyway.
        if (isGifLogo || !logoImage) {
            if (img) img.src = canvas.toDataURL("image/png");
            return;
        }

        const ctx = canvas.getContext("2d");
        const size = canvas.width;

        // Keep the logo around 22% of the QR's width — comfortably inside
        // the ~30% correction budget of Level H, with margin to spare.
        const logoSize = size * 0.22;
        const x = (size - logoSize) / 2;
        const y = (size - logoSize) / 2;

        // White padded background behind the logo so QR modules directly
        // under the logo edges don't interfere with its silhouette
        const pad = logoSize * 0.12;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2);

        // Fit the image inside the logoSize box without distorting it
        const aspect = logoImage.width / logoImage.height;
        let drawW = logoSize, drawH = logoSize;
        if (aspect > 1) {
            drawH = logoSize / aspect;
        } else if (aspect < 1) {
            drawW = logoSize * aspect;
        }
        const drawX = x + (logoSize - drawW) / 2;
        const drawY = y + (logoSize - drawH) / 2;

        ctx.drawImage(logoImage, drawX, drawY, drawW, drawH);

        // The visible element is the <img> the library swapped in, not the
        // canvas we just drew on — refresh it from our modified canvas.
        if (img) img.src = canvas.toDataURL("image/png");
    }

    function regenerate(value) {
        if (value) {
            qrcode.makeCode(value);
        } else {
            qrcode.clear();
            return;
        }
        drawLogo();
    }

    textInput.addEventListener("input", (e) => {
        regenerate(e.target.value.trim());
    });

    logoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();

        if (file.type === "image/gif") {
            reader.onload = (evt) => {
                // Live overlay: the browser animates this natively, no
                // canvas redraw loop needed. Make sure any previously
                // baked-in static logo is cleared from the canvas first.
                logoImage = null;
                isGifLogo = true;
                gifOverlay.src = evt.target.result;
                gifOverlay.style.display = "block";
                regenerate(textInput.value.trim());
            };
            reader.readAsDataURL(file);
            return;
        }

        // Static image path: bake it into the canvas as before
        reader.onload = (evt) => {
            const img = new Image();
            img.onload = () => {
                isGifLogo = false;
                gifOverlay.style.display = "none";
                gifOverlay.src = "";
                logoImage = img;
                regenerate(textInput.value.trim());
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    clearLogoBtn.addEventListener("click", () => {
        logoImage = null;
        isGifLogo = false;
        gifOverlay.style.display = "none";
        gifOverlay.src = "";
        logoInput.value = "";
        regenerate(textInput.value.trim());
    });

    // Initial render
    drawLogo();
</script>
</body>
</html>
