<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name the Term — NLP &amp; Transformer Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F3F7;
    --panel: #FFFFFF;
    --ink: #171B24;
    --ink-soft: #626E80;
    --rule: #D7DCE5;
    --accent: #2451E0;
    --accent-bg: #E7ECFC;
    --correct: #1F7A4D;
    --correct-bg: #E2F5EA;
    --incorrect: #C13B2F;
    --incorrect-bg: #FCE7E4;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  body {
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    background-attachment: fixed;
    min-height: 100vh;
    padding: 40px 20px 64px;
  }

  .sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--rule);
    box-shadow: 0 1px 0 var(--rule);
  }

  header {
    padding: 32px 36px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }

  .heading-block h1 {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .heading-block p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    max-width: 480px;
    line-height: 1.5;
  }

  .score-pill {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: var(--accent-bg);
    border: 1px solid var(--rule);
    padding: 10px 16px;
    white-space: nowrap;
    min-width: 128px;
    text-align: center;
  }

  .score-pill .value {
    display: block;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent);
    margin-top: 2px;
  }

  .score-pill.graded .value.perfect { color: var(--correct); }
  .score-pill.graded .value.partial { color: var(--incorrect); }

  main {
    padding: 8px 36px 12px;
  }

  .q-row {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 14px;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
  }

  .q-row:last-child { border-bottom: none; }

  .q-row .idx {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--ink-soft);
    padding-top: 3px;
  }

  .q-body .def-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 12px;
    max-width: 58ch;
  }

  .answer-line {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .answer-line label {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .answer-line input[type="text"] {
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 9px 12px;
    flex: 1 1 220px;
    min-width: 180px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .answer-line input[type="text"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .answer-line input[type="text"].correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
  }

  .answer-line input[type="text"].incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect);
    color: var(--incorrect);
  }

  .feedback {
    flex-basis: 100%;
    font-family: var(--sans);
    font-size: 0.8rem;
    color: var(--incorrect);
    margin-top: 2px;
  }

  footer {
    padding: 24px 36px 32px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

  button {
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 11px 20px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--panel);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.secondary {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--rule);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .answer-line input, button { transition: none; }
  }

  @media (max-width: 560px) {
    header, main, footer { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="heading-block">
      <h1>Name the Term</h1>
      <p>Read each definition from the NLP &amp; Transformer glossary and type the term it describes. Answers are checked loosely, so abbreviations, spelling variants, and small typos are accepted.</p>
    </div>
    <div class="score-pill" id="scorePill">
      score
      <span class="value" id="scoreValue">— / 10</span>
    </div>
  </header>

  <main id="questionsList"></main>

  <footer>
    <span class="hint" id="hintText">Answer all 10, then check your work.</span>
    <div class="btn-group">
      <button type="button" class="secondary" id="newSetBtn">New set</button>
      <button type="button" id="checkBtn">Check answers</button>
    </div>
  </footer>
</div>

<script>
  // Each entry: canonical display term, its definition, and a list of
  // accepted answer variants (full names, common abbreviations, spelling variants).
  const GLOSSARY = [
    { term: "NLP", def: "The broader field of linguistics and machine learning focused on enabling computers to understand, interpret, and generate human language.", answers: ["NLP", "Natural Language Processing"] },
    { term: "LLMs", def: "A powerful subset of NLP models characterized by massive scale, extensive training data, general capabilities, in-context learning, and emergent abilities.", answers: ["LLMs", "LLM", "Large Language Models", "Large Language Model"] },
    { term: "Self-supervised learning", def: "A type of training where the learning objective is computed automatically from the input text without requiring human-annotated labels.", answers: ["Self-supervised learning", "Self supervised learning"] },
    { term: "Pretraining", def: "The act of training a model from scratch with randomly initialized weights, typically on massive corpora of unlabeled data.", answers: ["Pretraining", "Pre-training"] },
    { term: "Transfer learning", def: "The process of taking a pretrained model and initializing a new model with its weights to adapt to a different task.", answers: ["Transfer learning"] },
    { term: "Fine-tuning", def: "The supervised, additional training performed on a pretrained model using a smaller, task-specific, human-annotated dataset.", answers: ["Fine-tuning", "Finetuning", "Fine tuning"] },
    { term: "Scratch", def: "Training a model completely from the beginning with randomly initialized weights, instead of leveraging a pretrained model.", answers: ["Scratch", "From scratch", "Training from scratch"] },
    { term: "Instruction tuning", def: "Fine-tuning a pretrained model to follow instructions and generate helpful responses.", answers: ["Instruction tuning"] },
    { term: "Architecture", def: "The structural skeleton of a model, defining its layers and mathematical operations.", answers: ["Architecture"] },
    { term: "Checkpoints", def: "The specific set of trained weights that are loaded into a given architecture.", answers: ["Checkpoints", "Checkpoint"] },
    { term: "Model", def: "An umbrella term that is often used loosely to refer to either an architecture, a checkpoint, or both.", answers: ["Model"] },
    { term: "Encoder", def: "The block of a Transformer that receives an input and builds a bidirectional representation, optimized for understanding-based tasks.", answers: ["Encoder"] },
    { term: "Decoder", def: "The block of a Transformer that uses the encoder's features alongside other inputs to autoregressively generate outputs, optimized for generative tasks.", answers: ["Decoder"] },
    { term: "Encoder-Decoder", def: "Models that utilize both the encoder and decoder to map an input sequence to an output sequence, such as for translation or summarization.", answers: ["Encoder-Decoder", "Encoder Decoder", "Sequence-to-Sequence", "Sequence to sequence", "Seq2seq"] },
    { term: "Attention layers", def: "Special layers in a Transformer that calculate how much specific attention the model should pay to certain words in a sentence relative to others.", answers: ["Attention layers", "Attention layer"] },
    { term: "Attention mask", def: "A mask used in self-attention or cross-attention to prevent the model from focusing on certain tokens, such as padding words or future tokens.", answers: ["Attention mask"] },
    { term: "Masked self-attention", def: "A specialized attention layer in decoders that restricts the model from attending to future tokens, so it can only look at tokens on its left.", answers: ["Masked self-attention", "Masked self attention"] },
    { term: "Masked Language Modeling", def: "An encoder-only training approach where a percentage of input tokens are randomly masked, and the model learns to predict them bidirectionally using surrounding context.", answers: ["Masked Language Modeling", "MLM"] },
    { term: "Causal Language Modeling", def: "An autoregressive training approach where the model predicts the next token based purely on the previous tokens to its left.", answers: ["Causal Language Modeling", "CLM"] },
    { term: "Next-sentence prediction", def: "A pretraining objective where the model predicts whether a given sentence B logically follows sentence A.", answers: ["Next-sentence prediction", "Next sentence prediction", "NSP"] },
    { term: "Text infilling", def: "A corruption strategy where multiple text spans of arbitrary lengths are replaced by a single mask token, and the model is trained to reconstruct the original text.", answers: ["Text infilling", "Infilling"] },
    { term: "Byte Pair Encoding", def: "A tokenization method used by models like GPT-2 to tokenize words and generate token embeddings.", answers: ["Byte Pair Encoding", "BPE"] },
    { term: "WordPiece", def: "A tokenization method used by models like BERT.", answers: ["WordPiece", "Word piece"] },
    { term: "[CLS] token", def: "A special classification token added to the beginning of sequences in models like BERT or ViT to capture the overall representation of the input.", answers: ["CLS token", "CLS", "[CLS] token", "[CLS]"] },
    { term: "[SEP] token", def: "A special token used to separate different sentences in a pair of inputs.", answers: ["SEP token", "SEP", "[SEP] token", "[SEP]"] },
    { term: "Mask token", def: "A special placeholder token, such as [MASK] or <mask>, representing a hidden word that the model is tasked with predicting.", answers: ["Mask token", "MASK", "[MASK]", "<mask>"] },
    { term: "Patch embedding", def: "Representing square, non-overlapping parts of an image as vector representations in Vision Transformers.", answers: ["Patch embedding", "Patch embeddings"] },
    { term: "Position embeddings", def: "Learnable embeddings added to token or patch embeddings to convey the spatial or sequential order of the input.", answers: ["Position embeddings", "Position embedding", "Positional embeddings", "Positional encoding"] },
    { term: "Segment embedding", def: "An embedding used in BERT to denote whether a token belongs to the first or second sentence in a pair.", answers: ["Segment embedding", "Segment embeddings"] },
    { term: "LSH attention", def: "An efficient attention mechanism, used by Reformer, that clusters queries and keys into hash buckets to restrict attention computation to highly similar vectors.", answers: ["LSH attention", "LSH", "Locality-Sensitive Hashing attention", "Locality Sensitive Hashing attention"] },
    { term: "Local attention", def: "An attention window mechanism, used by Longformer, where each token only pays attention to a small window of adjacent tokens, allowing the model to handle longer texts.", answers: ["Local attention"] },
    { term: "Axial positional encodings", def: "A factorized positional encoding method that splits a massive positional encoding matrix into two smaller matrices to conserve GPU memory.", answers: ["Axial positional encodings", "Axial positional encoding"] },
    { term: "Inference", def: "The process of using a trained model to generate predictions or text from a given input prompt.", answers: ["Inference"] },
    { term: "Prefill Phase", def: "The first phase of LLM inference where the entire input prompt is tokenized, converted into embeddings, and processed as a batch to build context representations.", answers: ["Prefill Phase", "Prefill", "Pre-fill phase"] },
    { term: "Decode Phase", def: "The second phase of LLM inference where the model autoregressively generates text one token at a time.", answers: ["Decode Phase", "Decode", "Decoding phase"] },
    { term: "KV caching", def: "An optimization technique that stores and reuses intermediate calculated keys and values from prior tokens to avoid redundant calculations during decoding.", answers: ["KV caching", "KV cache", "Key-Value caching", "Key Value caching"] },
    { term: "Time to First Token", def: "The performance metric measuring how quickly the model outputs its very first token, driven by the prefill phase.", answers: ["Time to First Token", "TTFT"] },
    { term: "Time Per Output Token", def: "The speed at which subsequent individual tokens are generated.", answers: ["Time Per Output Token", "TPOT"] },
    { term: "Throughput", def: "The number of concurrent inference requests the system can handle simultaneously.", answers: ["Throughput"] },
    { term: "VRAM Usage", def: "The amount of GPU memory occupied during the execution of the model and its active contexts.", answers: ["VRAM Usage", "VRAM"] },
    { term: "Logits", def: "The raw, unnormalized prediction scores output by the model's head for every word in its vocabulary.", answers: ["Logits", "Logit"] },
    { term: "Temperature Control", def: "A sampling parameter that alters the randomness of generation: higher settings increase creativity, while lower settings make choices more focused and deterministic.", answers: ["Temperature Control", "Temperature"] },
    { term: "Top-p Sampling", def: "A technique that filters token selection to only the most likely words whose cumulative probability matches a chosen percentage threshold.", answers: ["Top-p Sampling", "Top p sampling", "Nucleus Sampling", "Top-p", "Nucleus sampling"] },
    { term: "Top-k Filtering", def: "A strategy where the model only considers the k most likely next words.", answers: ["Top-k Filtering", "Top k filtering", "Top-k sampling", "Top-k"] },
    { term: "Presence Penalty", def: "A penalty applied to any token that has already appeared in the output to encourage the model to explore new vocabulary.", answers: ["Presence Penalty"] },
    { term: "Frequency Penalty", def: "A penalty that scales based on how often a token has already appeared, actively preventing repetitive text.", answers: ["Frequency Penalty"] },
    { term: "Beam Search", def: "A decoding strategy that maintains multiple candidate sequences simultaneously and selects the sequence with the highest overall probability.", answers: ["Beam Search"] },
    { term: "Sentiment analysis", def: "Classifying text as positive or negative based on its tone.", answers: ["Sentiment analysis"] },
    { term: "Zero-shot classification", def: "Classifying text into custom categories without requiring any prior fine-tuning on those specific labels.", answers: ["Zero-shot classification", "Zero shot classification"] },
    { term: "Named Entity Recognition", def: "Identifying and classifying key entities in text, such as persons, locations, and organizations.", answers: ["Named Entity Recognition", "NER"] },
    { term: "Part-of-speech tagging", def: "Labeling words with their grammatical roles in a sentence: noun, verb, adjective, and so on.", answers: ["Part-of-speech tagging", "POS tagging", "Part of speech tagging", "POS"] },
    { term: "Question answering", def: "Finding the answer to a question by extracting a span of text directly from a provided context.", answers: ["Question answering", "QA"] },
    { term: "Summarization", def: "Condensing a longer document into a shorter version while retaining the primary information and meaning.", answers: ["Summarization", "Summarisation"] },
    { term: "Translation", def: "Converting text from one language to another while preserving its meaning.", answers: ["Translation"] }
  ];

  const NUM_QUESTIONS = 10;
  let currentSet = [];

  function normalize(s) {
    return s
      .toLowerCase()
      .replace(/[\[\]()<>]/g, " ")
      .replace(/[-_/]/g, " ")
      .replace(/[^a-z0-9\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + cost
        );
      }
    }
    return dp[m][n];
  }

  function isCorrect(userInput, answers) {
    const norm = normalize(userInput);
    if (!norm) return false;
    for (const raw of answers) {
      const normAns = normalize(raw);
      if (norm === normAns) return true;

      if (normAns.length > 3) {
        const shorter = Math.min(norm.length, normAns.length);
        const longer = Math.max(norm.length, normAns.length);
        if ((norm.includes(normAns) || normAns.includes(norm)) && shorter / longer >= 0.6) {
          return true;
        }
      }

      const dist = levenshtein(norm, normAns);
      const threshold = Math.max(1, Math.floor(normAns.length * 0.2));
      if (dist <= threshold) return true;
    }
    return false;
  }

  function pickQuestions() {
    // Sampling with replacement: repeats across the 10 questions are allowed.
    const set = [];
    for (let i = 0; i < NUM_QUESTIONS; i++) {
      const idx = Math.floor(Math.random() * GLOSSARY.length);
      set.push(GLOSSARY[idx]);
    }
    return set;
  }

  function render() {
    currentSet = pickQuestions();
    const list = document.getElementById("questionsList");
    list.innerHTML = "";

    currentSet.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "q-row";

      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1).padStart(2, "0");

      const body = document.createElement("div");
      body.className = "q-body";

      const defText = document.createElement("p");
      defText.className = "def-text";
      defText.textContent = item.def;

      const answerLine = document.createElement("div");
      answerLine.className = "answer-line";

      const label = document.createElement("label");
      label.textContent = "term:";
      label.setAttribute("for", "answer-" + i);

      const input = document.createElement("input");
      input.type = "text";
      input.id = "answer-" + i;
      input.autocomplete = "off";
      input.spellcheck = false;
      input.placeholder = "type the term\u2026";

      answerLine.appendChild(label);
      answerLine.appendChild(input);

      body.appendChild(defText);
      body.appendChild(answerLine);

      row.appendChild(idx);
      row.appendChild(body);
      list.appendChild(row);
    });

    resetScore();
  }

  function resetScore() {
    const pill = document.getElementById("scorePill");
    const value = document.getElementById("scoreValue");
    pill.classList.remove("graded");
    value.classList.remove("perfect", "partial");
    value.textContent = "\u2014 / " + NUM_QUESTIONS;
    document.getElementById("hintText").textContent = "Answer all " + NUM_QUESTIONS + ", then check your work.";

    document.querySelectorAll(".answer-line input").forEach(inp => {
      inp.classList.remove("correct", "incorrect");
    });
    document.querySelectorAll(".feedback").forEach(fb => fb.remove());
  }

  function checkAnswers() {
    document.querySelectorAll(".feedback").forEach(fb => fb.remove());
    let score = 0;

    currentSet.forEach((item, i) => {
      const input = document.getElementById("answer-" + i);
      const answerLine = input.closest(".answer-line");
      const correct = isCorrect(input.value, item.answers);

      input.classList.remove("correct", "incorrect");
      if (correct) {
        input.classList.add("correct");
        score++;
      } else {
        input.classList.add("incorrect");
        const fb = document.createElement("span");
        fb.className = "feedback";
        fb.textContent = "Correct answer: " + item.term;
        answerLine.appendChild(fb);
      }
    });

    const pill = document.getElementById("scorePill");
    const value = document.getElementById("scoreValue");
    pill.classList.add("graded");
    value.classList.add(score === NUM_QUESTIONS ? "perfect" : "partial");
    value.textContent = score + " / " + NUM_QUESTIONS;
    document.getElementById("hintText").textContent =
      score === NUM_QUESTIONS ? "All correct. Nice work." : "Review the highlighted answers, then try a new set if you'd like.";
  }

  document.getElementById("checkBtn").addEventListener("click", checkAnswers);
  document.getElementById("newSetBtn").addEventListener("click", render);

  render();
</script>

</body>
</html>
