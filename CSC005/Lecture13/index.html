 L.appendChild(d)})}
// ---------- fill-in blanks ----------
function renderFields(){const L=$('fld');L.innerHTML='';const f=S(i).fills;
 FIELDS[i].forEach(([x,y,w,h,fs,rnd],j)=>{const t=document.createElement('textarea');t.className='fill'+(rnd?' round':'');t.rows=1;t.spellcheck=false;
  Object.assign(t.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',fontSize:fs+'px'});t.placeholder='?';t.title='Fill in the blank';
  t.setAttribute('aria-label',`Blank ${j+1} on slide ${i+1}`);t.value=f[j]||'';
  const pad=()=>{t.style.paddingTop='0';let z=fs;t.style.fontSize=z+'px';while(z>fs*.45&&(t.scrollHeight>h+1||t.scrollWidth>w+1)){z*=.92;t.style.fontSize=z+'px'}
   const sh=t.scrollHeight;t.style.paddingTop=Math.max(0,(h-Math.min(sh,h))/2)+'px'};
  t.oninput=()=>{f[j]=t.value;pad();save()};
  t.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();const n=L.children[j+1];n?n.focus():t.blur()}};
  L.appendChild(t);pad()})}
// ---------- tools ----------
function setTool(t){tool=t;document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 document.body.classList.remove('select','draw','erase','sticky');document.body.classList.add(t=='pen'||t=='hi'?'draw':t)}
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
// ---------- notes panel / thumbs ----------
$('notes').oninput=()=>{S(i).notes=$('notes').value;save()};
$('tnotes').onclick=()=>{$('tnotes').classList.toggle('on',!document.body.classList.toggle('nonotes'))};
$('tthumbs').onclick=()=>{$('tthumbs').classList.toggle('on',!document.body.classList.toggle('nothumbs'))};
for(let k=0;k<N;k++){const d=document.createElement('div'),t=new Image();t.src=src(k);t.alt='Slide '+(k+1);t.title='Slide '+(k+1);t.onclick=()=>go(k);d.appendChild(t);$('thumbs').appendChild(d);markThumb(k)}
function markThumb(k){$('thumbs').children[k].classList.toggle('dot',!!has(k))}
// ---------- navigation ----------
function go(k){i=Math.max(0,Math.min(N-1,k));$('img').src=src(i);$('img').alt='Slide '+(i+1);
 $('count').textContent=`${i+1} / ${N}`;$('bar').style.width=((i+1)/N*100)+'%';$('nh').textContent=`Notes — slide ${i+1}`;
 [...$('thumbs').children].forEach((t,j)=>t.classList.toggle('on',j==i));$('thumbs').children[i].scrollIntoView({block:'nearest',inline:'center'});
 $('notes').value=S(i).notes;buildText();renderFields();redraw();renderStickies();$('stage').scrollTo(0,0);history.replaceState(null,'','#'+(i+1))}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg=='TEXTAREA'||tg=='INPUT')return;
 if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();$('undo').click();return}if(e.ctrlKey||e.metaKey)return;
 const m={ArrowRight:()=>go(i+1),PageDown:()=>go(i+1),' ':()=>go(i+1),ArrowLeft:()=>go(i-1),PageUp:()=>go(i-1),Home:()=>go(0),End:()=>go(N-1),
 '+':()=>$('zin').click(),'=':()=>$('zin').click(),'-':()=>$('zout').click(),'0':()=>setZoom(0),f:()=>$('fs').click(),
 v:()=>setTool('select'),p:()=>setTool('pen'),h:()=>setTool('hi'),n:()=>setTool('sticky'),e:()=>setTool('erase')}[e.key];if(m){e.preventDefault();m()}});
let x0;$('stage').addEventListener('touchstart',e=>x0=tool=='select'&&!zoom?e.touches[0].clientX:null,{passive:true});
$('stage').addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(i+(d<0?1:-1))});
// ---------- backup / restore ----------
let dlr=null;try{claude.use('downloads').then(d=>dlr=d)}catch(_){}
function msg(t){$('status').textContent=t}
function arm(b,f){if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.lbl;f()}else{b.dataset.lbl=b.textContent;b.dataset.arm=1;b.textContent='Click again to confirm';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.lbl}},3000)}}
async function dl(blob,name){if(dlr){try{await dlr.save({filename:name,data:blob});msg('Downloaded '+name)}catch(e){msg(e.code=='declined'?'Download cancelled':'Download unavailable here')}return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exp').onclick=()=>dl(new Blob([JSON.stringify({deck:KEY,...store})],{type:'application/json'}),'lecture13-annotations.json');
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.slides)throw 0;
 store={slides:d.slides};save();for(let k=0;k<N;k++)markThumb(k);go(i)}catch(_){msg('⚠ Not a valid annotations backup')}e.target.value=''};
// ---------- PDF export ----------
const loadImg=s=>new Promise((r,j)=>{const m=new Image();m.onload=()=>r(m);m.onerror=j;m.src=s});
$('pdf').onclick=()=>makePdf($('pdf'),false);$('pdfa').onclick=()=>makePdf($('pdfa'),true);
async function makePdf(b,only){const lbl=b.textContent;
 b.disabled=true;const list=[...Array(N).keys()].filter(k=>!only||has(k));if(!list.length){msg('No annotated slides yet');b.disabled=false;return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'pt',format:[W,H]}),R=3;
 for(const[n,k]of list.entries()){b.textContent=`Saving ${n+1}/${list.length}…`;
  const c=document.createElement('canvas');c.width=W*R;c.height=H*R;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(await loadImg(src(k)),0,0,c.width,c.height);S(k).strokes.forEach(s=>drawStroke(g,s,R));
  if(n)doc.addPage([W,H],'landscape');doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);
  for(const[x,y,w,hh,fs,s]of TEXT[k]){doc.setFontSize(hh);doc.text(s,x,y+hh*.8,{renderingMode:'invisible',maxWidth:w+20})}
  FIELDS[k].forEach(([x,y,w,h,fs,rnd],j)=>{const v=(S(k).fills[j]||'').trim();doc.setDrawColor(200,85,58);doc.setLineWidth(.8);doc.setLineDashPattern([2,2],0);
   if(rnd)doc.ellipse(x+w/2,y+h/2,w/2,h/2,'S');else doc.line(x,y+h,x+w,y+h);doc.setLineDashPattern([],0);
   if(v){let z=fs,ls;do{doc.setFontSize(z);ls=doc.splitTextToSize(v,w-4);if(ls.length*z*1.15<=h||z<fs*.45)break;z*=.92}while(1);
    doc.setTextColor(29,63,138);doc.text(ls,x+w/2,y+h/2-(ls.length-1)*z*1.15/2,{align:'center',baseline:'middle',lineHeightFactor:1.15})}});
  for(const s of S(k).stickies){doc.setFillColor(255,246,168);doc.setDrawColor(216,198,74);doc.rect(s.x,s.y,s.w,s.h+9,'FD');doc.setFillColor(240,220,90);doc.rect(s.x,s.y,s.w,9,'F');
   doc.setFontSize(9);doc.setTextColor(34);doc.text(doc.splitTextToSize(s.t,s.w-6),s.x+3,s.y+19)}
  if(S(k).notes.trim()){doc.addPage([W,H],'landscape');doc.setFontSize(16);doc.setTextColor(34);doc.text(`Notes — slide ${k+1}`,36,44);
   doc.setFontSize(11);let y=72;for(const ln of doc.splitTextToSize(S(k).notes,W-72)){if(y>H-30){doc.addPage([W,H],'landscape');y=44}doc.text(ln,36,y);y+=15}}}
 await dl(doc.output('blob'),'lecture13-annotated.pdf');b.textContent=lbl;b.disabled=false}
go((parseInt(location.hash.slice(1))||1)-1);layout();
</script></body></html>
