function correct(k,j){const f=FIELDS[k][j],v=val(k,j);if(!('a' in f))return null;

function renderFields(){const L=$('fld');L.innerHTML='';const fl=S(i).fills;

  else{e=document.createElement('input');e.type=f.t=='check'?'checkbox':'radio';e.className='ctl';
   if(f.t=='radio')e.name=`s${i}g${f.g}`;Object.assign(e.style,{left:f.x+'px',top:f.y+'px',width:f.s+'px',height:f.s+'px'});

function markAnswers(){const els=$('fld').children;let ok=0,n=0;const seen=new Set();

  if(f.t=='radio'){if(seen.has(f.g))return;seen.add(f.g);const grp=FIELDS[i].map((g,k)=>[g,k]).filter(([g])=>g.t=='radio'&&g.g==f.g);

   const sel=grp.find(([g,k])=>val(i,k));(sel?[sel]:grp).forEach(([g,k])=>els[k].classList.add(good?'ok':'bad'));return}
  const c=correct(i,j);n++;ok+=c;e.classList.add(c?'ok':'bad')});
