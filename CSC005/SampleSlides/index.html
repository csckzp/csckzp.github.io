<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SampleSlides</title>
<script src="jspdf.umd.min.js"></script><script src="slides.js"></script>
<style>
:root{--bg:#f1efe8;--panel:#fff;--fg:#22232b;--muted:#6b6b76;--line:#d9d6cc;--accent:#d0603f;--sel:rgba(208,96,63,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d24;--panel:#262932;--fg:#eceae4;--muted:#9a9aa6;--line:#3a3d48}}
:root[data-theme="dark"]{--bg:#1b1d24;--panel:#262932;--fg:#eceae4;--muted:#9a9aa6;--line:#3a3d48}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
.grp:last-child{border:0}
button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:1px;background:transparent}
#count{min-width:62px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#zoomv{min-width:44px;text-align:center;color:var(--muted)}
#status{margin-left:auto;color:var(--muted);font-size:12px}
#bar{height:3px;background:var(--accent);width:0;transition:width .2s}
main{display:flex;min-height:0;min-width:0;overflow:hidden}
#stage{flex:1;overflow:auto;display:flex;padding:16px;min-width:0}
#frame{margin:auto;flex:none;position:relative;box-shadow:0 6px 30px #0005;border-radius:3px;overflow:hidden;background:#fff}
#inner{position:absolute;left:0;top:0;width:720px;height:405px;transform-origin:0 0}
#inner>*{position:absolute;inset:0}
#img{width:720px;height:405px;user-select:none;-webkit-user-drag:none}
#txt span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;line-height:1;cursor:text;font-family:sans-serif}
#txt span::selection{background:var(--sel);color:transparent}
#ink{width:720px;height:405px;pointer-events:none}
#stk,#fld{pointer-events:none}
.fill{position:absolute;pointer-events:auto;margin:0;border:0;border-bottom:1.5px dashed #c8553a;background:rgba(255,244,190,.6);color:#1d3f8a;font-family:system-ui,sans-serif;font-weight:600;text-align:center;resize:none;outline:none;overflow:hidden;line-height:1.15;padding:0 2px;border-radius:2px}
.fill.round{border:1.5px dashed #c8553a;border-radius:40%/50%}
.fill:focus{background:rgba(255,244,190,.95);border-color:#c8553a;border-style:solid;box-shadow:0 0 0 2px rgba(200,85,58,.25)}
.fill::placeholder{color:#c8553a;opacity:.55;font-weight:400}
body.draw #ink{pointer-events:auto;cursor:crosshair}body.erase #ink{pointer-events:auto;cursor:cell}
body.sticky #ink{pointer-events:auto;cursor:copy}
body:not(.select) #txt{pointer-events:none}
.note{position:absolute;pointer-events:auto;background:#fff6a8;border:1px solid #d8c64a;border-radius:3px;box-shadow:0 2px 6px #0003;display:flex;flex-direction:column;min-width:60px}
.note .h{height:9px;background:#f0dc5a;cursor:move;display:flex;justify-content:flex-end}
.note .h b{font:bold 8px/9px sans-serif;padding:0 3px;cursor:pointer;color:#6b5d00}
.note textarea{border:0;background:transparent;resize:both;font:9px/1.25 system-ui,sans-serif;color:#222;padding:3px;width:120px;height:50px;outline:none}
aside{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px}
body.nonotes aside{display:none}
aside h2{font-size:13px;margin:0;color:var(--muted);font-weight:600}
#notes{flex:1;resize:none;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:10px}
#thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#thumbs div{position:relative;flex:none}
#thumbs img{height:50px;display:block;border:2px solid transparent;border-radius:3px;cursor:pointer;opacity:.6;background:#fff}
#thumbs .on img{border-color:var(--accent);opacity:1}
#thumbs .dot::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
body.nothumbs #thumbs{display:none}
@media (max-width:700px){aside{position:fixed;inset:auto 0 0 0;width:auto;height:40vh;border-left:0;border-top:1px solid var(--line);z-index:5}}
</style></head><body class="select">
<header>
 <div class="grp"><button id="prev" title="Previous (←)">◀</button><span id="count"></span><button id="next" title="Next (→)">▶</button></div>
 <div class="grp"><button id="zout" title="Zoom out (−)">−</button><span id="zoomv">Fit</span><button id="zin" title="Zoom in (+)">+</button><button id="zfit" title="Fit to window (0)">Fit</button><button id="fs" title="Fullscreen (F)">⛶</button></div>
 <div class="grp" id="tools">
  <button data-t="select" class="on" title="Select text (V)">Select</button>
  <button data-t="pen" title="Pen (P)">Pen</button>
  <button data-t="hi" title="Highlighter (H)">Highlight</button>
  <button data-t="sticky" title="Sticky note (N)">Sticky</button>
  <button data-t="erase" title="Eraser (E)">Erase</button>
  <input type="color" id="color" value="#d0303f" title="Ink color">
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="clear" title="Clear this slide's ink and stickies">Clear</button>
 </div>
 <div class="grp"><button id="tnotes" class="on">Notes</button><button id="tthumbs" class="on">Thumbs</button></div>
 <div class="grp"><button id="pdf" title="PDF of all slides with your annotations and notes">PDF: all</button><button id="pdfa" title="PDF of only the slides you annotated">PDF: annotated</button><button id="exp" title="Back up annotations to a file">Backup</button><button id="imp" title="Restore annotations from a backup file">Restore</button><input type="file" id="impf" accept=".json" hidden></div>
 <span id="status"></span>
</header>
<div id="bar"></div>
<main>
 <div id="stage"><div id="frame"><div id="inner"><img id="img" alt=""><div id="txt"></div><canvas id="ink"></canvas><div id="stk"></div><div id="fld"></div></div></div></div>
 <aside><h2 id="nh">Notes</h2><textarea id="notes" placeholder="Type notes for this slide…"></textarea></aside>
</main>
<div id="thumbs"></div>

  Object.assign(t.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',fontSize:fs+'px'});t.placeholder='?';t.title='Fill in the blank';
  t.setAttribute('aria-label',`Blank ${j+1} on slide ${i+1}`);t.value=f[j]||'';
  const pad=()=>{t.style.paddingTop='0';let z=fs;t.style.fontSize=z+'px';while(z>fs*.45&&(t.scrollHeight>h+1||t.scrollWidth>w+1)){z*=.92;t.style.fontSize=z+'px'}
   const sh=t.scrollHeight;t.style.paddingTop=Math.max(0,(h-Math.min(sh,h))/2)+'px'};
  t.oninput=()=>{f[j]=t.value;pad();save()};
  t.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();const n=L.children[j+1];n?n.focus():t.blur()}};
  L.appendChild(t);pad()})}
// ---------- tools ----------
function setTool(t){tool=t;document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 document.body.classList.remove('select','draw','erase','sticky');document.body.classList.add(t=='pen'||t=='hi'?'draw':t)}
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
// ---------- notes panel / thumbs ----------
$('notes').oninput=()=>{S(i).notes=$('notes').value;save()};
$('tnotes').onclick=()=>{$('tnotes').classList.toggle('on',!document.body.classList.toggle('nonotes'))};
$('tthumbs').onclick=()=>{$('tthumbs').classList.toggle('on',!document.body.classList.toggle('nothumbs'))};
for(let k=0;k<N;k++){const d=document.createElement('div'),t=new Image();t.src=src(k);t.alt='Slide '+(k+1);t.title='Slide '+(k+1);t.onclick=()=>go(k);d.appendChild(t);$('thumbs').appendChild(d);markThumb(k)}
function markThumb(k){$('thumbs').children[k].classList.toggle('dot',!!has(k))}
// ---------- navigation ----------
function go(k){i=Math.max(0,Math.min(N-1,k));$('img').src=src(i);$('img').alt='Slide '+(i+1);
 $('count').textContent=`${i+1} / ${N}`;$('bar').style.width=((i+1)/N*100)+'%';$('nh').textContent=`Notes — slide ${i+1}`;
 [...$('thumbs').children].forEach((t,j)=>t.classList.toggle('on',j==i));$('thumbs').children[i].scrollIntoView({block:'nearest',inline:'center'});
 $('notes').value=S(i).notes;buildText();renderFields();redraw();renderStickies();$('stage').scrollTo(0,0);history.replaceState(null,'','#'+(i+1))}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg=='TEXTAREA'||tg=='INPUT')return;
 if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();$('undo').click();return}if(e.ctrlKey||e.metaKey)return;
 const m={ArrowRight:()=>go(i+1),PageDown:()=>go(i+1),' ':()=>go(i+1),ArrowLeft:()=>go(i-1),PageUp:()=>go(i-1),Home:()=>go(0),End:()=>go(N-1),
 '+':()=>$('zin').click(),'=':()=>$('zin').click(),'-':()=>$('zout').click(),'0':()=>setZoom(0),f:()=>$('fs').click(),
 v:()=>setTool('select'),p:()=>setTool('pen'),h:()=>setTool('hi'),n:()=>setTool('sticky'),e:()=>setTool('erase')}[e.key];if(m){e.preventDefault();m()}});
let x0;$('stage').addEventListener('touchstart',e=>x0=tool=='select'&&!zoom?e.touches[0].clientX:null,{passive:true});
$('stage').addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(i+(d<0?1:-1))});
// ---------- backup / restore ----------
let dlr=null;try{claude.use('downloads').then(d=>dlr=d)}catch(_){}
function msg(t){$('status').textContent=t}
function arm(b,f){if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.lbl;f()}else{b.dataset.lbl=b.textContent;b.dataset.arm=1;b.textContent='Click again to confirm';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.lbl}},3000)}}
async function dl(blob,name){if(dlr){try{await dlr.save({filename:name,data:blob});msg('Downloaded '+name)}catch(e){msg(e.code=='declined'?'Download cancelled':'Download unavailable here')}return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exp').onclick=()=>dl(new Blob([JSON.stringify({deck:KEY,...store})],{type:'application/json'}),'sampleslides-annotations.json');
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.slides)throw 0;
 store={slides:d.slides};save();for(let k=0;k<N;k++)markThumb(k);go(i)}catch(_){msg('⚠ Not a valid annotations backup')}e.target.value=''};
// ---------- PDF export ----------
const loadImg=s=>new Promise((r,j)=>{const m=new Image();m.onload=()=>r(m);m.onerror=j;m.src=s});
$('pdf').onclick=()=>makePdf($('pdf'),false);$('pdfa').onclick=()=>makePdf($('pdfa'),true);
async function makePdf(b,only){const lbl=b.textContent;
 b.disabled=true;const list=[...Array(N).keys()].filter(k=>!only||has(k));if(!list.length){msg('No annotated slides yet');b.disabled=false;return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'pt',format:[W,H]}),R=3;
 for(const[n,k]of list.entries()){b.textContent=`Saving ${n+1}/${list.length}…`;
  const c=document.createElement('canvas');c.width=W*R;c.height=H*R;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(await loadImg(src(k)),0,0,c.width,c.height);S(k).strokes.forEach(s=>drawStroke(g,s,R));
  if(n)doc.addPage([W,H],'landscape');doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);
  for(const[x,y,w,hh,fs,s]of TEXT[k]){doc.setFontSize(hh);doc.text(s,x,y+hh*.8,{renderingMode:'invisible',maxWidth:w+20})}
  FIELDS[k].forEach(([x,y,w,h,fs,rnd],j)=>{const v=(S(k).fills[j]||'').trim();doc.setDrawColor(200,85,58);doc.setLineWidth(.8);doc.setLineDashPattern([2,2],0);
   if(rnd)doc.ellipse(x+w/2,y+h/2,w/2,h/2,'S');else doc.line(x,y+h,x+w,y+h);doc.setLineDashPattern([],0);
   if(v){let z=fs,ls;do{doc.setFontSize(z);ls=doc.splitTextToSize(v,w-4);if(ls.length*z*1.15<=h||z<fs*.45)break;z*=.92}while(1);
    doc.setTextColor(29,63,138);doc.text(ls,x+w/2,y+h/2-(ls.length-1)*z*1.15/2,{align:'center',baseline:'middle',lineHeightFactor:1.15})}});
  for(const s of S(k).stickies){doc.setFillColor(255,246,168);doc.setDrawColor(216,198,74);doc.rect(s.x,s.y,s.w,s.h+9,'FD');doc.setFillColor(240,220,90);doc.rect(s.x,s.y,s.w,9,'F');
   doc.setFontSize(9);doc.setTextColor(34);doc.text(doc.splitTextToSize(s.t,s.w-6),s.x+3,s.y+19)}
  if(S(k).notes.trim()){doc.addPage([W,H],'landscape');doc.setFontSize(16);doc.setTextColor(34);doc.text(`Notes — slide ${k+1}`,36,44);
   doc.setFontSize(11);let y=72;for(const ln of doc.splitTextToSize(S(k).notes,W-72)){if(y>H-30){doc.addPage([W,H],'landscape');y=44}doc.text(ln,36,y);y+=15}}}
 await dl(doc.output('blob'),'sampleslides-annotated.pdf');b.textContent=lbl;b.disabled=false}
go((parseInt(location.hash.slice(1))||1)-1);layout();
</script></body></html>
