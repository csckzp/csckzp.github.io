<style>
:root{--bg:#f1efe8;--panel:#fff;--fg:#22232b;--muted:#6b6b76;--line:#d9d6cc;--accent:#d0603f;--sel:rgba(208,96,63,.3)}

:root[data-theme="dark"]{--bg:#1b1d24;--panel:#262932;--fg:#eceae4;--muted:#9a9aa6;--line:#3a3d48}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
.grp:last-child{border:0}
button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:1px;background:transparent}
#count{min-width:62px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#zoomv{min-width:44px;text-align:center;color:var(--muted)}

.lbl{color:var(--muted);font-size:12px;margin-right:2px}
#status{margin-left:auto;color:var(--muted);font-size:12px}
#bar{height:3px;background:var(--accent);width:0;transition:width .2s}
main{display:flex;min-height:0;min-width:0;overflow:hidden}
#stage{flex:1;overflow:auto;display:flex;padding:16px;min-width:0}
#frame{margin:auto;flex:none;position:relative;box-shadow:0 6px 30px #0005;border-radius:3px;overflow:hidden;background:#fff}
#inner{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
#inner>*{position:absolute;inset:0}
#img{width:960px;height:540px;user-select:none;-webkit-user-drag:none}
#lnk,#emb{pointer-events:none}
.embed{position:absolute;pointer-events:auto;background:#f6f4ee;border:1px solid #c9c4b6;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;font-family:system-ui,sans-serif;color:#33343c}
.embed .bar{flex:none;display:flex;align-items:center;gap:4px;height:12px;padding:0 4px;background:#3d4058;color:#eceae4;font-size:6.5px}
.embed .bar b{font-weight:600;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.embed .bar a,.embed .bar button{color:#eceae4;font:inherit;background:none;border:0;padding:0 3px;cursor:pointer;text-decoration:none;border-radius:2px}
.embed .bar a:hover,.embed .bar button:hover{background:#ffffff26}
.embed .card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:6px}
.embed .card .go{font:600 9px system-ui,sans-serif;color:#fff;background:#c8553a;border:0;border-radius:4px;padding:4px 12px;cursor:pointer}
.embed .card .go:hover{background:#a9442d}
.embed .card small{font-size:6px;color:#6b6b76;max-width:90%;overflow-wrap:anywhere}
.embed .vp{flex:1;position:relative;overflow:hidden}
.embed iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.embed.active{outline:2px solid #c8553a;outline-offset:1px}
.embed .hint{position:absolute;right:4px;bottom:4px;background:#3d4058e6;color:#fff;font-size:6px;padding:2px 5px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .2s}
.embed.active .hint{opacity:1}
body:not(.select) .embed{pointer-events:none}
.tipb{position:absolute;pointer-events:auto;margin:0;padding:0;border:0;background:none;cursor:help;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:50%;filter:drop-shadow(0 0 1px #fff8)}
.tipb:hover,.tipb:focus-visible,.tipb.on{background:rgba(200,85,58,.15);outline:none}
#tip{position:fixed;z-index:60;max-width:min(320px,80vw);background:#262932;color:#f2f0ea;font:14px/1.45 system-ui,sans-serif;padding:8px 11px;border-radius:7px;
 box-shadow:0 6px 24px #0006;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;white-space:pre-wrap;overflow-wrap:anywhere}
#tip.show{opacity:1;transform:none}
.timer,.clock{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:.25em;white-space:nowrap;font-family:system-ui,sans-serif;color:#2a2c3a;line-height:1}
.timer{background:rgba(255,255,255,.8);border:.08em solid #3d4058;border-radius:.3em;padding:0 .25em;box-sizing:border-box}
.timer.box,.clock.box{justify-content:center}
.timer .dig{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer button{font:inherit;font-size:.5em;line-height:1;padding:.25em .4em;margin:0;border:.12em solid #3d405880;border-radius:.35em;background:#fff;color:#2a2c3a;cursor:pointer}
.timer button:hover{border-color:#c8553a;color:#c8553a}
.timer.run .dig{color:#1d3f8a}.timer.pause .dig{color:#8a6d1d}
.timer.exp{border-color:#d0303f;box-shadow:0 0 0 .12em #d0303f}
.timer.exp .dig{color:#2a2c3a}
.clock{font-weight:600;font-variant-numeric:tabular-nums}
.rand{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:.4em;white-space:nowrap;overflow:hidden;box-sizing:border-box;font-family:system-ui,sans-serif;color:#2a2c3a;line-height:1;background:rgba(255,255,255,.85);border:.08em solid #3d4058;border-radius:.3em;padding:0 .4em}
.rand .res{font-weight:700;font-size:1.3em;min-width:1.3em;max-width:55%;overflow:hidden;text-overflow:ellipsis;text-align:center;font-variant-numeric:tabular-nums;color:#1d3f8a}
.rand.spin .res{color:#9a9db0}
.rand button{font:inherit;font-size:.5em;line-height:1;padding:.3em .55em;margin:0;border:.12em solid #3d405880;border-radius:.35em;background:#fff;color:#2a2c3a;cursor:pointer;flex:none}
.rand button:hover:not(:disabled){border-color:#c8553a;color:#c8553a}
.rand button:disabled{opacity:.45;cursor:default}
.rand .dr{font-weight:700}
.rand .hist{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:.5em;color:#6a6d80;font-variant-numeric:tabular-nums}
.embed .grip{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;z-index:2;touch-action:none;
 background:linear-gradient(135deg,transparent 0 45%,#3d4058 45% 52%,transparent 52% 64%,#3d4058 64% 71%,transparent 71% 83%,#3d4058 83% 90%,transparent 90%);opacity:.75}
.embed .grip:hover{opacity:1}
.embed.resizing iframe{pointer-events:none}
#lnk a{position:absolute;pointer-events:auto;border-radius:2px;cursor:pointer}
#lnk a:hover,#lnk a:focus-visible{background:rgba(29,63,138,.12);outline:1px solid rgba(29,63,138,.45);outline-offset:1px}
body:not(.select) #lnk a{pointer-events:none}
#txt span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;line-height:1;cursor:text;font-family:sans-serif}
#txt span::selection{background:var(--sel);color:transparent}
#ink{width:960px;height:540px;pointer-events:none}
#stk,#fld{pointer-events:none}
.fill{position:absolute;pointer-events:auto;margin:0;border:0;border-bottom:1.5px dashed #c8553a;background:rgba(255,244,190,.6);color:#1d3f8a;font-family:system-ui,sans-serif;font-weight:600;text-align:center;resize:none;outline:none;overflow:hidden;line-height:1.15;padding:0 2px;border-radius:2px}
.fill.round{border:1.5px dashed #c8553a;border-radius:40%/50%}
.fill:focus{background:rgba(255,244,190,.95);border-color:#c8553a;border-style:solid;box-shadow:0 0 0 2px rgba(200,85,58,.25)}
.ctl{position:absolute;pointer-events:auto;margin:0;accent-color:#c8553a;cursor:pointer}
select.ctl{border:1.5px dashed #c8553a;background:rgba(255,244,190,.6);color:#1d3f8a;font-family:system-ui,sans-serif;font-weight:600;border-radius:3px;padding:0 2px;outline:none}
select.ctl:focus{border-style:solid;background:rgba(255,244,190,.95)}
.ok{outline:2px solid #2e8b57!important;outline-offset:1px;box-shadow:0 0 0 3px rgba(46,139,87,.25)}
.bad{outline:2px solid #d0303f!important;outline-offset:1px;box-shadow:0 0 0 3px rgba(208,48,63,.25)}
#chk.on{background:#2e8b57;border-color:#2e8b57}
.fill::placeholder{color:#c8553a;opacity:.55;font-weight:400}
body.draw #ink{pointer-events:auto;cursor:crosshair}body.erase #ink{pointer-events:auto;cursor:cell}
body.sticky #ink{pointer-events:auto;cursor:copy}
body:not(.select) #txt{pointer-events:none}
.note{position:absolute;pointer-events:auto;background:#fff6a8;border:1px solid #d8c64a;border-radius:3px;box-shadow:0 2px 6px #0003;display:flex;flex-direction:column;min-width:60px}
.note .h{height:11px;background:#f0dc5a;cursor:move;display:flex;justify-content:flex-end;align-items:center;gap:1px}
.note .h b{font:bold 8px/11px sans-serif;padding:0 3px;cursor:pointer;color:#6b5d00;border-radius:2px;user-select:none}.note .h b:hover{background:#e2cb3c}.note .h i{flex:1}
.note textarea{border:0;background:transparent;resize:both;font:9px/1.25 system-ui,sans-serif;color:#222;padding:3px;width:120px;height:50px;outline:none}
aside{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px}
body.nonotes aside{display:none}
aside h2{font-size:13px;margin:0;color:var(--muted);font-weight:600}
#notes{flex:1;resize:none;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:10px}
#thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#thumbs div{position:relative;flex:none}
#thumbs img{height:50px;display:block;border:2px solid transparent;border-radius:3px;cursor:pointer;opacity:.6;background:#fff}
#thumbs .on img{border-color:var(--accent);opacity:1}
#thumbs .dot::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
body.nothumbs #thumbs{display:none}
@media (max-width:700px){aside{position:fixed;inset:auto 0 0 0;width:auto;height:40vh;border-left:0;border-top:1px solid var(--line);z-index:5}}
