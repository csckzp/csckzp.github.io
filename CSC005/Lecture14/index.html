for(let k=0;k<N;k++){const d=document.createElement('div'),t=new Image();t.src=src(k);t.alt='Slide '+(k+1);t.title='Slide '+(k+1);t.onclick=()=>go(k);d.appendChild(t);$('thumbs').appendChild(d);markThumb(k)}
function markThumb(k){$('thumbs').children[k].classList.toggle('dot',!!has(k))}
// ---------- embeds (click to load, sandboxed) ----------
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function renderEmbeds(){const L=$('emb');L.innerHTML='';
 FIELDS[i].forEach((f,j)=>{if(f.t!='embed')return;let host='';try{host=new URL(f.u).hostname}catch(_){return}
  const [ew,eh]=esize(i,j);
  const d=document.createElement('div');d.className='embed';Object.assign(d.style,{left:f.x+'px',top:f.y+'px',width:ew+'px',height:eh+'px'});
  d.innerHTML=`<div class="bar"><b>${esc(host)}</b><a href="${esc(f.u)}" target="_blank" rel="noopener noreferrer" title="Open in a new tab">Open ↗</a></div>
   <div class="card"><button class="go">Load ${esc(host)}</button><small>${navigator.onLine?'Loads an external page. Some sites refuse to appear inside other pages — use “Open ↗” then.':'You appear to be offline. This content needs an internet connection.'}</small></div>`;
  d.querySelector('.go').onclick=()=>loadEmbed(d,f);
  const g=document.createElement('div');g.className='grip';g.title='Drag to resize · double-click to reset';d.appendChild(g);
  g.onpointerdown=e=>{e.preventDefault();e.stopPropagation();g.setPointerCapture(e.pointerId);d.classList.add('resizing');
   const sx=e.clientX,sy=e.clientY,ow=d.offsetWidth,oh=d.offsetHeight;
   g.onpointermove=ev=>{const w=Math.max(80,Math.min(W-f.x,ow+(ev.clientX-sx)/scale)),h=Math.max(50,Math.min(H-f.y,oh+(ev.clientY-sy)/scale));
    d.style.width=w+'px';d.style.height=h+'px';sizeEmbeds()};
   g.onpointerup=()=>{g.onpointermove=g.onpointerup=null;d.classList.remove('resizing');S(i).emb[j]=[Math.round(d.offsetWidth*10)/10,Math.round(d.offsetHeight*10)/10];save()}};
  g.ondblclick=()=>{delete S(i).emb[j];d.style.width=f.w+'px';d.style.height=f.h+'px';sizeEmbeds();save()};
  L.appendChild(d)})}
function loadEmbed(d,f){const same=(()=>{try{return new URL(f.u).origin===location.origin}catch(_){return true}})();
 const fr=document.createElement('iframe');
 // No allow-same-origin unless the author trusted this domain AND it isn't our own origin:
 // the embedded page can then never read this page or students' saved work.
 fr.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation'+(f.tr&&!same?' allow-same-origin':''));
 fr.setAttribute('allow',f.tr&&!same?'fullscreen; autoplay; encrypted-media; picture-in-picture':'fullscreen');
 fr.referrerPolicy='no-referrer';fr.setAttribute('credentialless','');fr.title='Embedded page: '+f.u;fr.src=f.u;
 const vp=document.createElement('div');vp.className='vp';vp.appendChild(fr);
 const hint=document.createElement('div');hint.className='hint';hint.textContent='Click outside this frame to use slide keys again';vp.appendChild(hint);
 d.querySelector('.card').replaceWith(vp);
 const un=document.createElement('button');un.textContent='Close ✕';un.title='Unload this page';un.onclick=()=>renderEmbeds();d.querySelector('.bar').appendChild(un);
 sizeEmbeds()}
// Lay the frame out in real screen pixels (so sites don't get their phone layout), then scale it back down to slide size.
function sizeEmbeds(){document.querySelectorAll('#emb .vp').forEach(vp=>{const fr=vp.firstChild,w=vp.offsetWidth,h=vp.offsetHeight;
 Object.assign(fr.style,{width:w*scale+'px',height:h*scale+'px',transform:`scale(${1/scale})`})})}
addEventListener('blur',()=>setTimeout(()=>{const a=document.activeElement;document.querySelectorAll('.embed').forEach(e=>e.classList.toggle('active',!!a&&e.contains(a)))}));
addEventListener('focus',()=>document.querySelectorAll('.embed.active').forEach(e=>e.classList.remove('active')));
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.embed'))document.querySelectorAll('.embed.active').forEach(x=>x.classList.remove('active'))});
// ---------- links ----------
function renderLinks(){const L=$('lnk');L.innerHTML='';for(const[x,y,w,h,kind,t]of LINKS[i]){const a=document.createElement('a');
 Object.assign(a.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 if(kind=='u'){a.href=t;a.target='_blank';a.rel='noopener noreferrer';a.title=t}
 else{a.href='#'+(t+1);a.title='Go to slide '+(t+1);a.onclick=e=>{e.preventDefault();go(t)}}

// ---------- navigation ----------
function go(k){i=Math.max(0,Math.min(N-1,k));$('img').src=src(i);$('img').alt='Slide '+(i+1);
 $('count').textContent=`${i+1} / ${N}`;$('bar').style.width=((i+1)/N*100)+'%';$('nh').textContent=`Notes — slide ${i+1}`;
 [...$('thumbs').children].forEach((t,j)=>t.classList.toggle('on',j==i));$('thumbs').children[i].scrollIntoView({block:'nearest',inline:'center'});
 $('notes').value=S(i).notes;checking=false;$('chk').classList.remove('on');buildText();renderLinks();renderEmbeds();renderFields();redraw();renderStickies();$('stage').scrollTo(0,0);history.replaceState(null,'','#'+(i+1))}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg=='TEXTAREA'||tg=='INPUT')return;
 if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();$('undo').click();return}if(e.ctrlKey||e.metaKey)return;
 const m={ArrowRight:()=>go(i+1),PageDown:()=>go(i+1),' ':()=>go(i+1),ArrowLeft:()=>go(i-1),PageUp:()=>go(i-1),Home:()=>go(0),End:()=>go(N-1),
 '+':()=>$('zin').click(),'=':()=>$('zin').click(),'-':()=>$('zout').click(),'0':()=>setZoom(0),f:()=>$('fs').click(),
 v:()=>setTool('select'),t:()=>$('tthumbs').click(),']':()=>$('tnotes').click(),'\\':()=>$('tfocus').click(),p:()=>setTool('pen'),h:()=>setTool('hi'),n:()=>setTool('sticky'),e:()=>setTool('erase')}[e.key];if(m){e.preventDefault();m()}});
let x0;$('stage').addEventListener('touchstart',e=>x0=tool=='select'&&!zoom?e.touches[0].clientX:null,{passive:true});
$('stage').addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(i+(d<0?1:-1))});
// ---------- backup / restore ----------
let dlr=null;try{claude.use('downloads').then(d=>dlr=d)}catch(_){}
function msg(t){$('status').textContent=t}
function arm(b,f){if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.lbl;f()}else{b.dataset.lbl=b.textContent;b.dataset.arm=1;b.textContent='Click again to confirm';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent=b.dataset.lbl}},3000)}}
async function dl(blob,name){if(dlr){try{await dlr.save({filename:name,data:blob});msg('Downloaded '+name)}catch(e){msg(e.code=='declined'?'Download cancelled':'Download unavailable here')}return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

$('imp').onclick=()=>$('impf').click();

 store={slides:d.slides};save();for(let k=0;k<N;k++)markThumb(k);go(i)}catch(_){msg('⚠ Not a valid annotations backup')}e.target.value=''};
// ---------- PDF export ----------
const loadImg=s=>new Promise((r,j)=>{const m=new Image();m.onload=()=>r(m);m.onerror=j;m.src=s});
$('pdf').onclick=()=>makePdf($('pdf'),false);$('pdfa').onclick=()=>makePdf($('pdfa'),true);
async function makePdf(b,only){const lbl=b.textContent;
 b.disabled=true;const list=[...Array(N).keys()].filter(k=>!only||has(k));if(!list.length){msg('No annotated slides yet');b.disabled=false;return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'pt',format:[W,H]}),R=3;
 const pageOf={},jumps=[];
 for(const[n,k]of list.entries()){b.textContent=`Saving ${n+1}/${list.length}…`;
  const c=document.createElement('canvas');c.width=W*R;c.height=H*R;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(await loadImg(src(k)),0,0,c.width,c.height);S(k).strokes.forEach(s=>drawStroke(g,s,R));
  if(n)doc.addPage([W,H],'landscape');doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);pageOf[k]=doc.getNumberOfPages();
  for(const[x,y,w,hh,kind,t]of LINKS[k]){if(kind=='u')doc.link(x,y,w,hh,{url:t});else jumps.push([pageOf[k],x,y,w,hh,t])}
  for(const[x,y,w,hh,fs,s]of TEXT[k]){doc.setFontSize(hh);doc.text(s,x,y+hh*.8,{renderingMode:'invisible',maxWidth:w+20})}
  FIELDS[k].forEach((f0,j)=>{if(f0.t!='embed')return;const [ew,eh]=esize(k,j),f={...f0,w:ew,h:eh};doc.setFillColor(246,244,238);doc.setDrawColor(201,196,182);doc.setLineWidth(.6);doc.rect(f.x,f.y,f.w,f.h,'FD');
   doc.setFillColor(61,64,88);doc.rect(f.x,f.y,f.w,12,'F');doc.setFontSize(7);doc.setTextColor(236,234,228);let host=f.u;try{host=new URL(f.u).hostname}catch(_){}doc.text('Embedded: '+host,f.x+4,f.y+8.2);
   doc.setFontSize(8);doc.setTextColor(29,63,138);doc.text(doc.splitTextToSize(f.u,f.w-16),f.x+f.w/2,f.y+12+(f.h-12)/2,{align:'center',baseline:'middle'});doc.link(f.x,f.y,f.w,f.h,{url:f.u})});
  FIELDS[k].forEach((f,j)=>{if(f.t=='embed')return;const v=val(k,j);doc.setDrawColor(200,85,58);doc.setLineWidth(.8);doc.setTextColor(29,63,138);
   if(f.t=='text'){const t=(v||'').trim();doc.setLineDashPattern([2,2],0);if(f.r)doc.ellipse(f.x+f.w/2,f.y+f.h/2,f.w/2,f.h/2,'S');else doc.line(f.x,f.y+f.h,f.x+f.w,f.y+f.h);doc.setLineDashPattern([],0);
    if(t){let z=f.fs,ls;do{doc.setFontSize(z);ls=doc.splitTextToSize(t,f.w-4);if(ls.length*z*1.15<=f.h||z<f.fs*.45)break;z*=.92}while(1);
     doc.text(ls,f.x+f.w/2,f.y+f.h/2-(ls.length-1)*z*1.15/2,{align:'center',baseline:'middle',lineHeightFactor:1.15})}}
   else if(f.t=='choice'){doc.setLineDashPattern([2,2],0);doc.rect(f.x,f.y,f.w,f.h,'S');doc.setLineDashPattern([],0);
    const a=f.x+f.w-f.h*.55,b=f.y+f.h*.4;doc.setFillColor(200,85,58);doc.triangle(a-f.h*.18,b,a+f.h*.18,b,a,b+f.h*.25,'F');
    if(v){doc.setFontSize(f.fs);doc.text(String(v),f.x+3,f.y+f.h/2,{baseline:'middle',maxWidth:f.w-f.h})}}
   else if(f.t=='check'){doc.rect(f.x,f.y,f.s,f.s,'S');if(v){doc.setDrawColor(29,63,138);doc.setLineWidth(1.4);doc.line(f.x+f.s*.2,f.y+f.s*.55,f.x+f.s*.42,f.y+f.s*.78);doc.line(f.x+f.s*.42,f.y+f.s*.78,f.x+f.s*.82,f.y+f.s*.22)}}
   else{doc.circle(f.x+f.s/2,f.y+f.s/2,f.s/2,'S');if(v){doc.setFillColor(29,63,138);doc.circle(f.x+f.s/2,f.y+f.s/2,f.s*.25,'F')}}});
  for(const s of S(k).stickies){doc.setFillColor(255,246,168);doc.setDrawColor(216,198,74);doc.rect(s.x,s.y,s.w,s.h+11,'FD');doc.setFillColor(240,220,90);doc.rect(s.x,s.y,s.w,11,'F');
   const fz=s.fs||9;doc.setFontSize(fz);doc.setTextColor(34);doc.text(doc.splitTextToSize(s.t,s.w-6),s.x+3,s.y+11+3+fz*.85,{lineHeightFactor:1.25})}
  if(S(k).notes.trim()){doc.addPage([W,H],'landscape');doc.setFontSize(16);doc.setTextColor(34);doc.text(`Notes — slide ${k+1}`,36,44);
   doc.setFontSize(11);let y=72;for(const ln of doc.splitTextToSize(S(k).notes,W-72)){if(y>H-30){doc.addPage([W,H],'landscape');y=44}doc.text(ln,36,y);y+=15}}}
 for(const[pg,x,y,w,hh,t]of jumps)if(pageOf[t]){doc.setPage(pg);doc.link(x,y,w,hh,{pageNumber:pageOf[t]})}
 await dl(doc.output('blob'),'lecture14-annotated.pdf');b.textContent=lbl;b.disabled=false}
go((parseInt(location.hash.slice(1))||1)-1);layout();
