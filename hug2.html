<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Terms — Tokenization, Model I/O &amp; Serving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F3F7;
    --panel: #FFFFFF;
    --ink: #171B24;
    --ink-soft: #626E80;
    --rule: #D7DCE5;
    --accent: #2451E0;
    --accent-bg: #E7ECFC;
    --correct: #1F7A4D;
    --correct-bg: #E2F5EA;
    --incorrect: #C13B2F;
    --incorrect-bg: #FCE7E4;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  body {
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    background-attachment: fixed;
    min-height: 100vh;
    padding: 40px 20px 64px;
  }

  .sheet {
    max-width: 920px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--rule);
    box-shadow: 0 1px 0 var(--rule);
  }

  header {
    padding: 32px 36px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }

  .heading-block h1 {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .heading-block p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    max-width: 480px;
    line-height: 1.5;
  }

  .score-pill {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: var(--accent-bg);
    border: 1px solid var(--rule);
    padding: 10px 16px;
    white-space: nowrap;
    min-width: 128px;
    text-align: center;
  }

  .score-pill .value {
    display: block;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent);
    margin-top: 2px;
  }

  .score-pill.graded .value.perfect { color: var(--correct); }
  .score-pill.graded .value.partial { color: var(--incorrect); }

  main {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
  }

  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
    .col-defs { border-top: 1px solid var(--rule); }
  }

  .col {
    padding: 28px 36px 36px;
  }

  .col-terms {
    border-right: 1px solid var(--rule);
  }

  @media (max-width: 780px) {
    .col-terms { border-right: none; }
  }

  .col-label {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0 0 18px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  .term-row {
    display: grid;
    grid-template-columns: 26px 1fr 108px;
    align-items: center;
    gap: 12px;
    padding: 12px 10px;
    border-bottom: 1px solid var(--rule);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .term-row:last-child { border-bottom: none; }

  .term-row .idx {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .term-row .term-name {
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.35;
  }

  .term-row select {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 7px 8px;
    width: 100%;
    appearance: auto;
    cursor: pointer;
  }

  .term-row select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .term-row.correct {
    background: var(--correct-bg);
    border-bottom-color: var(--correct-bg);
  }

  .term-row.incorrect {
    background: var(--incorrect-bg);
    border-bottom-color: var(--incorrect-bg);
  }

  .feedback {
    grid-column: 1 / -1;
    font-family: var(--sans);
    font-size: 0.8rem;
    margin-top: -4px;
  }

  .feedback.wrong-text { color: var(--incorrect); }

  .def-row {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 12px;
    padding: 13px 10px;
    border-bottom: 1px solid var(--rule);
  }

  .def-row:last-child { border-bottom: none; }

  .def-row .letter {
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent);
  }

  .def-row .def-text {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--ink);
    max-width: 62ch;
  }

  footer {
    padding: 24px 36px 32px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

  button {
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 11px 20px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--panel);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.secondary {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--rule);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .term-row, button { transition: none; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="heading-block">
      <h1>Match the Terms</h1>
      <p>Tokenization, model I/O, batching, and serving optimizations. Select the letter of the matching definition for each term, then check your work.</p>
    </div>
    <div class="score-pill" id="scorePill">
      score
      <span class="value" id="scoreValue">— / 10</span>
    </div>
  </header>

  <main>
    <div class="col col-terms">
      <p class="col-label">terms</p>
      <div id="termsList"></div>
    </div>
    <div class="col col-defs">
      <p class="col-label">definitions</p>
      <div id="defsList"></div>
    </div>
  </main>

  <footer>
    <span class="hint" id="hintText">Answer all 10, then check your work.</span>
    <div class="btn-group">
      <button type="button" class="secondary" id="newSetBtn">New set</button>
      <button type="button" id="checkBtn">Check answers</button>
    </div>
  </footer>
</div>

<script>
  const GLOSSARY = [
    { term: "Tokenizer", def: "A core component of the NLP pipeline that converts raw text inputs into numbers that a neural network model can process." },
    { term: "Tokens", def: "The individual units, such as words, subwords, or symbols like punctuation, obtained after splitting the input text." },
    { term: "Vocabulary", def: "The set defined by the total number of independent tokens present in a tokenizer's corpus." },
    { term: "Encoding", def: "The two-step process of converting text to numbers, which includes splitting text into tokens and converting those tokens into numerical input IDs." },
    { term: "Decoding", def: "The reverse of encoding, which translates vocabulary indices or input IDs back into a readable text string." },
    { term: "Word-based Tokenization", def: "An approach that splits raw text into words based on whitespace and punctuation rules; it tends to produce very large vocabularies and frequent unknown tokens." },
    { term: "Character-based Tokenization", def: "An approach that splits raw text into individual characters, yielding much smaller vocabularies and fewer unknown tokens, but creating far more tokens per sequence." },
    { term: "Subword Tokenization", def: "A hybrid approach that leaves frequently used words intact but decomposes rare words into smaller, meaningful subwords, as in WordPiece, BPE, and Unigram." },
    { term: "Tensors", def: "Multidimensional rectangular arrays, analogous to NumPy arrays, that serve as the required input format for Transformer models." },
    { term: "Auto Classes (AutoModel & AutoTokenizer)", def: "Wrapper classes that automatically resolve and load the appropriate model architecture or tokenizer configuration based on a given model checkpoint." },
    { term: "Hidden States (or Features)", def: "High-dimensional vectors output by the base Transformer module that represent the contextual understanding of each input token." },
    { term: "Model Head", def: "An additional component, usually one or a few linear layers, that converts the raw high-dimensional hidden states into task-specific outputs, such as sequence classification." },
    { term: "Logits", def: "The raw, unnormalized prediction scores outputted by the final layer of the model before they are converted into probabilities, typically via a SoftMax layer." },
    { term: "Batching", def: "The act of sending multiple sequences or sentences through a model simultaneously." },
    { term: "Padding & Padding Tokens", def: "The practice of adding a special padding token to shorter sequences in a batch so that they match the length of the longest sequence, giving the resulting tensor a uniform rectangular shape." },
    { term: "Attention Masks", def: "Companion tensors of the exact same shape as the input IDs, filled with 1s and 0s, that instruct the model's attention layers which tokens to attend to and which padding tokens to ignore." },
    { term: "Flash Attention", def: "A technique that optimizes the attention mechanism by improving memory transfers between High Bandwidth Memory and fast SRAM cache to bypass hardware memory bandwidth bottlenecks." },
    { term: "PagedAttention", def: "A KV-cache memory management strategy that divides attention keys and values into fixed-size pages stored non-contiguously in memory to prevent fragmentation and increase serving throughput." },
    { term: "Quantization", def: "A technique that reduces the precision of model weights, for example from 32-bit or 16-bit floats to 8-bit or 4-bit integers, to drastically decrease memory footprint and boost speed." },
    { term: "Token Sampling Parameters", def: "Parameters used to control next-token selection during generation, including temperature, top-p (nucleus) sampling, and top-k filtering." }
  ];

  const NUM_QUESTIONS = 10;
  const LETTERS = "ABCDEFGHIJ".split("");

  let currentSet = []; // [{term, def, correctLetter}]

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildSet() {
    const chosen = shuffle(GLOSSARY).slice(0, NUM_QUESTIONS);
    const termOrder = shuffle(chosen);
    const defOrder = shuffle(chosen);
    currentSet = termOrder.map(item => ({
      term: item.term,
      def: item.def,
      correctLetter: LETTERS[defOrder.findIndex(d => d.term === item.term)]
    }));
    return defOrder;
  }

  function render() {
    const defOrder = buildSet();

    const termsList = document.getElementById("termsList");
    const defsList = document.getElementById("defsList");
    termsList.innerHTML = "";
    defsList.innerHTML = "";

    currentSet.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "term-row";
      row.dataset.correct = item.correctLetter;

      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1).padStart(2, "0");

      const name = document.createElement("span");
      name.className = "term-name";
      name.textContent = item.term;

      const select = document.createElement("select");
      select.setAttribute("aria-label", "Definition for " + item.term);
      const blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "choose \u2014";
      select.appendChild(blank);
      LETTERS.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        select.appendChild(opt);
      });

      row.appendChild(idx);
      row.appendChild(name);
      row.appendChild(select);
      termsList.appendChild(row);
    });

    defOrder.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "def-row";

      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = LETTERS[i];

      const text = document.createElement("span");
      text.className = "def-text";
      text.textContent = item.def;

      row.appendChild(letter);
      row.appendChild(text);
      defsList.appendChild(row);
    });

    resetScore();
  }

  function resetScore() {
    const pill = document.getElementById("scorePill");
    const value = document.getElementById("scoreValue");
    pill.classList.remove("graded");
    value.classList.remove("perfect", "partial");
    value.textContent = "\u2014 / " + NUM_QUESTIONS;
    document.getElementById("hintText").textContent = "Answer all " + NUM_QUESTIONS + ", then check your work.";

    document.querySelectorAll(".term-row").forEach(row => {
      row.classList.remove("correct", "incorrect");
      const fb = row.querySelector(".feedback");
      if (fb) fb.remove();
    });
  }

  function checkAnswers() {
    const rows = document.querySelectorAll(".term-row");
    let score = 0;

    rows.forEach(row => {
      const select = row.querySelector("select");
      const chosen = select.value;
      const correct = row.dataset.correct;
      const existingFb = row.querySelector(".feedback");
      if (existingFb) existingFb.remove();

      if (chosen === correct) {
        row.classList.remove("incorrect");
        row.classList.add("correct");
        score++;
      } else {
        row.classList.remove("correct");
        row.classList.add("incorrect");
        const fb = document.createElement("span");
        fb.className = "feedback wrong-text";
        fb.textContent = chosen
          ? "Correct answer: " + correct
          : "No answer selected \u2014 correct answer: " + correct;
        row.appendChild(fb);
      }
    });

    const pill = document.getElementById("scorePill");
    const value = document.getElementById("scoreValue");
    pill.classList.add("graded");
    value.classList.add(score === NUM_QUESTIONS ? "perfect" : "partial");
    value.textContent = score + " / " + NUM_QUESTIONS;
    document.getElementById("hintText").textContent =
      score === NUM_QUESTIONS ? "All correct. Nice work." : "Review the highlighted rows, then try a new set if you'd like.";
  }

  document.getElementById("checkBtn").addEventListener("click", checkAnswers);
  document.getElementById("newSetBtn").addEventListener("click", render);

  render();
</script>

</body>
</html>
